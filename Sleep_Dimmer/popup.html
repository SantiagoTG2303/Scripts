<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    body { width: 260px; margin: 0; padding: 14px 16px; font: 13px -apple-system, system-ui, sans-serif;
           background: #111; color: #ddd; }
    h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
    label { display: block; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .value { color: #999; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: #888; }
    input[type=number] { width: 60px; background: #222; color: #ddd; border: 1px solid #333; border-radius: 4px; padding: 3px 5px; }
    .check { display: flex; align-items: center; gap: 8px; }
    button { width: 100%; padding: 9px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
             background: #333; color: #eee; cursor: pointer; }
    button.on { background: #6b2a2a; }
    #status { margin-top: 10px; color: #888; text-align: center; min-height: 1em; font-variant-numeric: tabular-nums; }
    .hint { margin-top: 8px; color: #666; font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <h1>Sleep Dimmer</h1>

  <label>
    <div class="row"><span>Start darkness</span><span class="value" id="startVal"></span></div>
    <input type="range" id="startOpacity" min="0" max="100" step="1">
  </label>

  <label>
    <div class="row"><span>End darkness</span><span class="value" id="endVal"></span></div>
    <input type="range" id="endOpacity" min="0" max="100" step="1">
  </label>

  <label class="row">
    <span>Minutes to reach end</span>
    <input type="number" id="durationMin" min="1" max="600">
  </label>

  <label class="check">
    <input type="checkbox" id="pauseAtEnd">
    <span>Pause video when fully dark</span>
  </label>

  <button id="toggle"></button>
  <div id="status"></div>
  <div class="hint">Shortcut: ⌥P (change at chrome://extensions/shortcuts)</div>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
